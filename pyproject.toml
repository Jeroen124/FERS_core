[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FERS"
version          = "0.1.92"
description = "Finite Element Method library written in Rust with Python interface"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Jeroen Hermsen", email = "info@ferscloud.com"},
]
# PyPI search matches on these. Without them the package was findable only by
# someone who already knew its name.
keywords = [
    "structural-analysis",
    "structural-engineering",
    "finite-element",
    "fem",
    "fea",
    "beam",
    "frame",
    "truss",
    "eurocode",
    "en1993",
    "steel-design",
    "civil-engineering",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.1.0",
    "matplotlib>=3.7.0",
    "ujson>=5.10.0",
    "sectionproperties>=3.7.0",
    "pyvista>=0.44.0",
    "fers_calculations==0.2.63",
    "pydantic>=2.10.0",
    "scipy>=1.14.0",
    "ezdxf>=1.3.0",
]

# PyPI renders these as the sidebar links. `pip install FERS` is the command
# every doc gives, and until now its project page linked nowhere at all — no
# homepage, no docs, no source. That is a dead end for a developer and for the
# agents that read package pages before choosing a dependency.
[project.urls]
Homepage = "https://ferscloud.com"
Documentation = "https://ferscloud.com/docs/installation"
"Python guide" = "https://ferscloud.com/structural-analysis-python"
"Worked examples" = "https://ferscloud.com/docs/python-examples"
Source = "https://github.com/Jeroen124/FERS_core"
Issues = "https://github.com/Jeroen124/FERS_core/issues"

[tool.setuptools.packages.find]
include = ["fers_core*"]

[tool.setuptools.package-data]
fers_core = ["examples/*"]

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg", ".mypy_cache", ".nox",
    ".pants.d", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv",
    "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "venv",
    # Auto-generated by datamodel-codegen (long schema descriptions exceed line-length).
    "fers_core/types/pydantic_models.py",
]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "E501"]
ignore = ["A001", "E741"]
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10