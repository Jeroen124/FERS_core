# .github/workflows/ci-and-release.yml
name: Lint, Test & Release

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: 🔍 Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }
      - run: pip install ruff==0.15.12
      - run: ruff check .
      # Formatting was never gated, so the repo drifted 53 files out of shape
      # against current ruff while pre-commit sat on v0.6.7. Pinned above and
      # checked here so the two cannot disagree again.
      - run: ruff format --check .

  test:
    name: 🧪 Pytest
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }
      - run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest
          pip install -r requirements.txt

      - run: pytest --maxfail=1 --disable-warnings -q

  lean:
    name: 🪶 Lean install
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.12" }
      # What an agent's sandbox gets from `pip install FERS`: no plotting,
      # section-design or DXF extras. It must still import, solve and check,
      # and must not have pulled an extra in through a hard dependency. Run
      # from outside the checkout, so the installed wheel is what imports:
      # from the repo root a wheel missing mesh_table.json.gz would still pass.
      - run: |
          pip install --upgrade pip
          pip install . pytest
          cd "$RUNNER_TEMP"
          python -c "import importlib.util as u, sys; x = [m for m in ('matplotlib', 'pyvista', 'vtk', 'scipy', 'sectionproperties', 'ezdxf') if u.find_spec(m)]; sys.exit(f'extras installed: {x}' if x else 0)"
          python -c "import fers_core, sys; sys.exit(0 if 'site-packages' in fers_core.__file__ else f'not the wheel: {fers_core.__file__}')"
          fers version
          python -m pytest -q -p no:cacheprovider --import-mode=importlib "$GITHUB_WORKSPACE/tests/functionality/test_lean_import.py" "$GITHUB_WORKSPACE/tests/members/test_mesh_table.py"
          fers examples run 001 --dir "$RUNNER_TEMP/examples"
          fers examples run 811 --dir "$RUNNER_TEMP/examples"

  deploy:
    name: 📦 Build & Publish to PyPI
    needs: [lint, test, lean]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }
      - run: |
          pip install --upgrade pip
          pip install build twine
      - name: Build sdist & wheel
        run: python -m build --sdist --wheel
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI }}
        run: twine upload dist/*

      # One release per SDK version, carrying the skill as the zip Claude.ai takes
      # as an upload. Tagged v*, beside the mcp-v* releases of the MCP server;
      # links to the .mcpb filter on mcp-v, so neither shadows the other.
      - name: GitHub release with the skill zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released."
            exit 0
          fi
          pip install dist/*.whl
          fers skill --zip fers-skill.zip
          gh release create "v$VERSION" fers-skill.zip --title "FERS $VERSION" \
            --notes "pip install FERS==$VERSION. For Claude.ai, upload fers-skill.zip as a skill (Settings, Capabilities). Changes: https://github.com/Jeroen124/FERS_core/blob/main/CHANGELOG.md"
